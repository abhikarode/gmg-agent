name: Codex verification

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Run declared verification
        run: python3 .codex/bin/codex-verify --ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-verification
          path: |
            .codex/evidence/ci-verification.json
            .codex/evidence/logs/ci/
